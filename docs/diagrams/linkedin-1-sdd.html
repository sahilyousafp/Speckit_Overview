<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spec-driven development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="linkedin.css">
<style>
  .content svg { height: auto; }
  .old { fill: none; stroke: #b9b0a0; stroke-width: 2.5; }
  .old-ln { stroke: #b9b0a0; stroke-width: 2.5; fill: none; }
  .spec { fill: var(--ink); }
  .step { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
  .ln { stroke: var(--ink); stroke-width: 2.5; fill: none; }
  svg text.row { font-family: var(--mono); font-weight: 600; letter-spacing: 0.1em; }
  svg text.faint { fill: #a39b8e; }
  svg text.paper { fill: var(--paper); }
</style>
</head>
<body>
<main class="li">
  <div class="kicker"><span><b>speckit-overview</b> &middot; for GitHub Spec Kit</span><span>1 / 4</span></div>
  <h1><em>Spec-driven</em><br>development</h1>

  <div class="content">
    <svg viewBox="0 0 904 520" role="img" aria-label="Prompt-driven: prompt, code, fix, and back to prompt in a loop. Spec-driven: spec, then plan, tasks and code in a straight line.">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17171b"/></marker>
        <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b0a0"/></marker>
      </defs>

      <!-- prompt-driven: a loop -->
      <text class="row faint" x="0" y="22" font-size="20">PROMPT-DRIVEN</text>
      <rect class="old" x="2" y="52" width="236" height="84" rx="42"/>
      <text class="m faint" x="120" y="104" font-size="30" font-weight="600" text-anchor="middle">prompt</text>
      <line class="old-ln" x1="238" y1="94" x2="332" y2="94" marker-end="url(#ahf)"/>
      <rect class="old" x="334" y="52" width="236" height="84" rx="42"/>
      <text class="m faint" x="452" y="104" font-size="30" font-weight="600" text-anchor="middle">code</text>
      <line class="old-ln" x1="570" y1="94" x2="664" y2="94" marker-end="url(#ahf)"/>
      <rect class="old" x="666" y="52" width="236" height="84" rx="42"/>
      <text class="m faint" x="784" y="104" font-size="30" font-weight="600" text-anchor="middle">fix</text>
      <path class="old-ln" d="M784 136V196H120V140" marker-end="url(#ahf)"/>

      <!-- spec-driven: a straight line -->
      <text class="row accent" x="0" y="330" font-size="20">SPEC-DRIVEN</text>
      <rect class="spec" x="0" y="360" width="190" height="90" rx="45"/>
      <text class="m paper" x="95" y="416" font-size="30" font-weight="600" text-anchor="middle">spec</text>
      <line class="ln" x1="190" y1="405" x2="236" y2="405" marker-end="url(#ah)"/>
      <rect class="step" x="238" y="361" width="190" height="88" rx="44"/>
      <text class="m" x="333" y="416" font-size="30" font-weight="600" text-anchor="middle">plan</text>
      <line class="ln" x1="428" y1="405" x2="474" y2="405" marker-end="url(#ah)"/>
      <rect class="step" x="476" y="361" width="190" height="88" rx="44"/>
      <text class="m" x="571" y="416" font-size="30" font-weight="600" text-anchor="middle">tasks</text>
      <line class="ln" x1="666" y1="405" x2="712" y2="405" marker-end="url(#ah)"/>
      <rect class="step" x="714" y="361" width="188" height="88" rx="44"/>
      <text class="m" x="808" y="416" font-size="30" font-weight="600" text-anchor="middle">code</text>
    </svg>
  </div>

  <footer><b>speckit-overview</b><span>github.com/sahilyousafp/Speckit_Overview</span></footer>
</main>
</body>
</html>
